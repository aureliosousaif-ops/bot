services:
  - type: web
    name: sousinha-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MODE
        value: public
      - key: OWNER_NAME
        value: Administrador
      - key: OWNER_NUMBER
        sync: false
      - key: SUDO_NUMBERS
        sync: false
      - key: SESSION_ID
        sync: false
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: AUTO_LIKE_STATUS
        value: "false"
      - key: AUTO_READ_STATUS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_AUTH_STORAGE
        value: postgres
      - key: WHATSAPP_AUTH_DATABASE_URL
        sync: false
      - key: WHATSAPP_AUTH_SESSION_ID
        value: sousinha-bot
      - key: MALVIN_API_KEY
        sync: false
